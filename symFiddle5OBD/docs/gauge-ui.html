<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>飞度5 圆屏仪表 · UI 定稿存档</title>
<style>
  html,body{margin:0;padding:0;background:#eef0f3;color:#2b2e35;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:680px;margin:0 auto;padding:18px 12px 40px}
  .hint{font-size:12px;line-height:1.9;color:#7b828c;margin:0 0 12px;padding:0 6px}
  .hint b{color:#2b2e35;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<p class="hint">
  <b>466×466 圆屏仪表 · 设计定稿</b><br>
  指针颜色随转速变化（绿 → 黄 → 橙 → 红），外圈为金属环带。拖动滑块或点场景按钮查看。
</p>

<div id="gauge-root">
<style>
#gauge-root{max-width:680px;margin:0 auto;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
#gauge-root svg{display:block;width:100%;height:auto}
#gauge-root .ctl{display:flex;align-items:center;gap:14px;margin-top:2px;padding:0 6px;flex-wrap:wrap}
#gauge-root input[type=range]{flex:1;min-width:150px;accent-color:#2b2e35}
#gauge-root .btns{display:flex;gap:6px;flex-wrap:wrap}
#gauge-root button{font:inherit;font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid #d8dce3;background:#f4f6f9;color:#3a3f47;cursor:pointer;transition:.15s;white-space:nowrap}
#gauge-root button:hover{background:#e9edf3}
#gauge-root button.on{background:#2b2e35;border-color:#2b2e35;color:#fff}
</style>

<svg viewBox="0 0 680 508" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="plateG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#c9cdd4"/>
  </linearGradient>
  <linearGradient id="rimG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.34" stop-color="#e6e9ee"/>
    <stop offset="0.70" stop-color="#c1c6ce"/>
    <stop offset="1" stop-color="#99a0aa"/>
  </linearGradient>
  <linearGradient id="faceG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fdfdff"/>
    <stop offset="1" stop-color="#d9dbe0"/>
  </linearGradient>
  <linearGradient id="slotG" x1="0" y1="0" x2="1" y2="0.55">
    <stop offset="0" stop-color="#b6bac2"/>
    <stop offset="0.5" stop-color="#d8dbe1"/>
    <stop offset="1" stop-color="#eef0f3"/>
  </linearGradient>
  <linearGradient id="hubDishG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9aa0a9"/>
    <stop offset="0.6" stop-color="#d5d9df"/>
    <stop offset="1" stop-color="#f2f3f6"/>
  </linearGradient>
  <radialGradient id="hubMetalG" cx="0.36" cy="0.28" r="0.82">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.42" stop-color="#e4e7ec"/>
    <stop offset="0.78" stop-color="#c6cbd3"/>
    <stop offset="1" stop-color="#9ba1aa"/>
  </radialGradient>
  <filter id="shPanel" x="-25%" y="-25%" width="150%" height="150%">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#6b7280" flood-opacity="0.14"/>
  </filter>
  <filter id="shHub" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#5b616b" flood-opacity="0.28"/>
  </filter>
  <filter id="shNeedle" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="3" stdDeviation="3.2" flood-color="#5d5f66" flood-opacity="0.24"/>
  </filter>
</defs>

<!-- 外圈金属环带 -->
<circle cx="340" cy="250" r="232" fill="url(#plateG)"/>
<circle cx="340" cy="250" r="229" fill="none" stroke="url(#rimG)" stroke-width="6"/>
<circle cx="340" cy="250" r="231.7" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.92"/>
<circle cx="340" cy="250" r="226.4" fill="none" stroke="#8d939d" stroke-width="1.2" opacity="0.6"/>
<path d="M159.1 108.6 A229.6 229.6 0 0 1 520.9 108.6" fill="none" stroke="#ffffff" stroke-width="2.6" opacity="0.72" stroke-linecap="round"/>

<!-- 红区下沉槽 -->
<path id="slot" fill="url(#slotG)"/>
<path id="slotIn" fill="none" stroke="#9aa0aa" stroke-width="1.5" opacity="0.5"/>
<path id="slotOut" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.85"/>
<g id="blocks"></g>
<g id="ticks"></g>

<!-- 内盘面 -->
<circle cx="340" cy="250" r="152" fill="url(#faceG)" filter="url(#shPanel)"/>
<circle cx="340" cy="250" r="151" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8"/>

<g id="nums"></g>
<text x="340" y="203" text-anchor="middle" font-size="12" fill="#9aa0a9" letter-spacing="1.4">1/min ×1000</text>

<!-- 水温文字 + 数值 -->
<g id="tempRow">
  <text id="tLabel" x="302" y="366" text-anchor="end" dominant-baseline="central" font-size="15" fill="#9aa0a9" letter-spacing="1">水温</text>
  <text id="tVal" x="346" y="366" text-anchor="middle" dominant-baseline="central" font-size="46" font-weight="300" fill="#2b2e35">42</text>
  <text id="tUnit" x="390" y="366" text-anchor="start" dominant-baseline="central" font-size="18" fill="#9aa0a9">°C</text>
</g>

<!-- 指针（颜色随转速） -->
<g id="needle" filter="url(#shNeedle)">
  <path id="needleBody" d="M340 72 L345.2 230 L342.6 304 L340 310 L337.4 304 L334.8 230 Z" fill="#22c55e" stroke="#0e7a3a" stroke-width="0.7" stroke-linejoin="round"/>
  <path d="M338.4 100 L341.4 228 L340.3 296" fill="none" stroke="#ffffff" stroke-width="1.7" opacity="0.55" stroke-linecap="round"/>
  <circle cx="340" cy="74" r="2.8" fill="#ffffff" opacity="0.85"/>
</g>

<!-- 金属轴心（三层：金属面 / 内凹盘 / 轴心点） -->
<g id="hub" filter="url(#shHub)">
  <circle cx="340" cy="250" r="36" fill="url(#hubMetalG)"/>
  <circle cx="340" cy="250" r="36" fill="none" stroke="#8b919b" stroke-width="0.9" opacity="0.55"/>
  <circle cx="340" cy="250" r="19" fill="url(#hubDishG)"/>
  <circle cx="340" cy="250" r="19" fill="none" stroke="#9aa0aa" stroke-width="0.8" opacity="0.5"/>
  <circle cx="340" cy="250" r="7" fill="#7d838c"/>
</g>
</svg>

<div class="ctl">
  <input id="sl" type="range" min="0" max="10000" step="10" value="1450">
  <div class="btns">
    <button data-r="1450" data-c="41" class="on">怠速冷车</button>
    <button data-r="5200" data-c="84">城市巡航</button>
    <button data-r="9000" data-c="89">急加速</button>
    <button data-r="3200" data-c="108">过热</button>
  </div>
</div>
</div>
<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  var CX=340, CY=250, RMAX=10000, A0=240, SW=240;
  function ang(v){ return A0 + SW*v/RMAX; }
  function rad(d){ return d*Math.PI/180; }
  function PX(r,d){ return CX + r*Math.sin(rad(d)); }
  function PY(r,d){ return CY - r*Math.cos(rad(d)); }
  function el(n,a){ var e=document.createElementNS(NS,n); for(var k in a) e.setAttribute(k,a[k]); return e; }
  function sector(rI,rO,a0,a1){
    var lg = Math.abs(a1-a0)>180?1:0;
    return 'M'+PX(rO,a0)+' '+PY(rO,a0)+'A'+rO+' '+rO+' 0 '+lg+' 1 '+PX(rO,a1)+' '+PY(rO,a1)
      +'L'+PX(rI,a1)+' '+PY(rI,a1)+'A'+rI+' '+rI+' 0 '+lg+' 0 '+PX(rI,a0)+' '+PY(rI,a0)+'Z';
  }
  function arcPath(r,a0,a1){
    var lg = Math.abs(a1-a0)>180?1:0;
    return 'M'+PX(r,a0)+' '+PY(r,a0)+'A'+r+' '+r+' 0 '+lg+' 1 '+PX(r,a1)+' '+PY(r,a1);
  }

  document.getElementById('slot').setAttribute('d', sector(198,226,228,492));
  document.getElementById('slotIn').setAttribute('d', arcPath(199.5,228,492));
  document.getElementById('slotOut').setAttribute('d', arcPath(224.5,228,492));

  var blocks=document.getElementById('blocks');
  blocks.appendChild(el('path',{d:sector(202.5,221.5,432.4,455.6),fill:'#F0812E'}));
  blocks.appendChild(el('path',{d:sector(202.5,221.5,456.4,480),fill:'#E23A2C'}));

  var ticks=document.getElementById('ticks');
  for(var v=0; v<=RMAX; v+=500){
    var maj = (v%1000===0), a=ang(v), r1=maj?168:178;
    ticks.appendChild(el('line',{
      x1:PX(r1,a), y1:PY(r1,a), x2:PX(192,a), y2:PY(192,a),
      stroke: maj?'#5a5f68':'#8a8f98',
      'stroke-width': maj?2.2:1,
      opacity: maj?0.85:0.45,
      'stroke-linecap':'round'
    }));
  }

  var nums=document.getElementById('nums');
  for(var w=0; w<=RMAX; w+=1000){
    var aa=ang(w);
    var t=el('text',{
      x:PX(129,aa), y:PY(129,aa),
      'text-anchor':'middle','dominant-baseline':'central',
      'font-size':27,'font-weight':400,fill:'#2b2e35'
    });
    t.textContent = w/1000;
    nums.appendChild(t);
  }

  var needle=document.getElementById('needle');
  var needleBody=document.getElementById('needleBody');
  var tVal=document.getElementById('tVal');
  var sl=document.getElementById('sl');

  /* 指针配色：0 绿 → 4000 亮绿 → 6000 黄 → 7800 橙 → 8600 红 → 10000 深红 */
  var STOP=[[0,[34,197,94]],[0.40,[74,222,128]],[0.60,[250,204,21]],
            [0.78,[251,146,60]],[0.86,[239,68,68]],[1,[220,38,38]]];
  function mix(v){
    var t=v/RMAX;
    for(var i=0;i<STOP.length-1;i++){
      var a=STOP[i], b=STOP[i+1];
      if(t<=b[0]){
        var k=(t-a[0])/(b[0]-a[0]), c=[0,0,0];
        for(var j=0;j<3;j++) c[j]=Math.round(a[1][j]+(b[1][j]-a[1][j])*k);
        return c;
      }
    }
    return STOP[STOP.length-1][1];
  }
  function hex(c){ return '#'+c.map(function(x){return ('0'+x.toString(16)).slice(-2)}).join(''); }
  function dark(c,f){ return '#'+c.map(function(x){return ('0'+Math.max(0,Math.round(x*f)).toString(16)).slice(-2)}).join(''); }

  function tempColor(c){
    if(c>=105) return '#E23A2C';
    if(c<55) return '#2E7FD0';
    return '#2b2e35';
  }
  function setRpm(v){
    needle.setAttribute('transform','rotate('+ang(v)+','+CX+','+CY+')');
    var c=mix(v);
    needleBody.setAttribute('fill', hex(c));
    needleBody.setAttribute('stroke', dark(c,0.62));
  }
  function setClt(c){
    var col = tempColor(c);
    tVal.textContent = Math.round(c);
    tVal.setAttribute('fill', col);
  }

  sl.addEventListener('input', function(){ setRpm(+sl.value); });

  var btns=[].slice.call(document.querySelectorAll('#gauge-root button'));
  btns.forEach(function(b){
    b.addEventListener('click', function(){
      btns.forEach(function(x){x.classList.remove('on')});
      b.classList.add('on');
      var r=+b.dataset.r, c=+b.dataset.c;
      sl.value=r; setRpm(r); setClt(c);
    });
  });

  setRpm(1450); setClt(41);
})();
</script>
</div>
</body>
</html>
